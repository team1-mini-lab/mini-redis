<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><title>장면 5 함께 세야 하는 값이 틀림</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="960" height="520" fill="#FFFFFF"/><text x="480.0" y="34" font-size="20" fill="#222222" font-weight="bold" text-anchor="middle">⑤ 함께 세야 하는 값이 틀림: 재고 1개에 주문 두 건이 동시에</text><rect x="10" y="52" width="460" height="458" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><text x="240" y="80" font-size="16" fill="#555555" font-weight="bold" text-anchor="middle">로컬 캐시 (서버마다 따로)</text><rect x="490" y="52" width="460" height="458" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><text x="720" y="80" font-size="16" fill="#555555" font-weight="bold" text-anchor="middle">mini-redis (아직 구현 안 함)</text><rect x="30" y="100" width="190" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="125.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="125.0" y="144" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">주문 1</text><rect x="45" y="160" width="160" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="125.0" y="180" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">캐시 (dict)</text><text x="125.0" y="200" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">재고 1 → 판매</text><rect x="270" y="100" width="190" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="365.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="365.0" y="144" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">주문 2 (같은 순간)</text><rect x="285" y="160" width="160" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="365.0" y="180" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">캐시 (dict)</text><text x="365.0" y="200" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">재고 1 → 판매</text><text x="240" y="320" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">두 서버가 각자 '재고 1'을 보고 판매</text><text x="240" y="350" font-size="16" fill="#D64545" font-weight="bold" text-anchor="middle">재고 1개가 두 번 팔림</text><text x="240" y="494" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ 서로의 판매를 모름</text><rect x="510" y="100" width="190" height="80" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="605.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><rect x="750" y="100" width="190" height="80" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="845.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="605" y="150" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">주문 1</text><text x="845" y="150" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">주문 2</text><rect x="610" y="250" width="220" height="70" rx="10" fill="#DDF3EE" stroke="#2E9C84" stroke-width="2"/><text x="720.0" y="272" font-size="13" fill="#2E9C84" font-weight="bold" text-anchor="middle">mini-redis (서버 밖 한 곳)</text><text x="720.0" y="294" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">재고: 1</text><line x1="605" y1="182" x2="660" y2="248" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="520" y="225" font-size="13" fill="#444" font-weight="normal" text-anchor="start">get → set</text><line x1="845" y1="182" x2="790" y2="248" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="820" y="225" font-size="13" fill="#444" font-weight="normal" text-anchor="start">get → set</text><text x="720" y="360" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">읽기와 쓰기 사이에 다른 서버가 끼어들 수 있음</text><text x="720" y="382" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">실제 Redis는 DECR 한 번으로 막음</text><text x="720" y="420" font-size="14" fill="#B8860B" font-weight="bold" text-anchor="middle">12단계(원자적 증가, 선택)에서 다룰 문제</text><text x="720" y="494" font-size="15" fill="#B8860B" font-weight="bold" text-anchor="middle">– 아직 같은 문제가 남아 있음</text></svg>