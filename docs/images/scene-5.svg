<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>장면 5 함께 세야 하는 값이 어긋남</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="600" height="470" fill="#FFFFFF"/><text x="300.0" y="32" font-size="19" fill="#222222" font-weight="bold" text-anchor="middle">⑤ 함께 세야 하는 값이 어긋남</text><text x="300.0" y="56" font-size="14" fill="#555555" font-weight="normal" text-anchor="middle">남은 수량 1개에 요청 두 건이 동시에 옴</text><rect x="10" y="70" width="580" height="390" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><rect x="40" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="160.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="160.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">요청 1</text><rect x="320" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="440.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="440.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">요청 2 (같은 순간)</text><rect x="60" y="150" width="200" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="160.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="160.0" y="190" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">남은 수량 1 → 0</text><rect x="340" y="150" width="200" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="440.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="440.0" y="190" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">남은 수량 1 → 0</text><text x="300.0" y="300" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">두 서버가 각자 '남은 수량 1'을 보고 하나씩 뺌</text><text x="300.0" y="340" font-size="16" fill="#D64545" font-weight="bold" text-anchor="middle">1개뿐인데 두 번 처리됨</text><text x="300.0" y="420" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ 서로 바꾼 값을 모르고, 같은 캐시를 써도 읽고 저장하는 사이에 끼어듦</text><text x="300.0" y="444" font-size="13" fill="#2E8B57" font-weight="bold" text-anchor="middle">→ 읽기·빼기·저장을 한 번에 하는 명령(INCR·DECR)이 필요</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>