<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><title>장면 2 로그인이 풀림</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="960" height="520" fill="#FFFFFF"/><text x="480.0" y="34" font-size="20" fill="#222222" font-weight="bold" text-anchor="middle">② 로그인이 풀림: A에서 로그인한 고객의 다음 요청이 B로 감</text><rect x="10" y="52" width="460" height="458" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><text x="240" y="80" font-size="16" fill="#555555" font-weight="bold" text-anchor="middle">로컬 캐시 (서버마다 따로)</text><rect x="490" y="52" width="460" height="458" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><text x="720" y="80" font-size="16" fill="#555555" font-weight="bold" text-anchor="middle">mini-redis (서버 밖 한 곳)</text><rect x="30" y="100" width="190" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="125.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="125.0" y="144" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">로그인 처리</text><rect x="45" y="160" width="160" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="125.0" y="180" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">캐시 (dict)</text><text x="125.0" y="200" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">세션: 토큰 → 고객</text><rect x="270" y="100" width="190" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="365.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="365.0" y="144" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">다음 요청을 받음</text><rect x="285" y="160" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#D64545" stroke-width="2" stroke-dasharray="6 4"/><text x="365.0" y="180" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">캐시 (dict)</text><text x="365.0" y="200" font-size="14" fill="#D64545" font-weight="bold" text-anchor="middle">세션 없음</text><text x="125" y="300" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">① 로그인 → 세션 저장</text><text x="365" y="300" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">② 같은 토큰으로 요청</text><text x="365" y="330" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">401 로그인이 필요해요</text><text x="240" y="494" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ 고객은 다음 클릭에서 로그아웃됨</text><rect x="510" y="100" width="190" height="80" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="605.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><rect x="750" y="100" width="190" height="80" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="845.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="605" y="150" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">로그인 처리</text><text x="845" y="150" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">다음 요청을 받음</text><rect x="620" y="270" width="200" height="70" rx="10" fill="#DDF3EE" stroke="#2E9C84" stroke-width="2"/><text x="720.0" y="292" font-size="13" fill="#2E9C84" font-weight="bold" text-anchor="middle">mini-redis (서버 밖 한 곳)</text><text x="720.0" y="314" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">세션: 토큰 → 고객</text><line x1="605" y1="182" x2="670" y2="268" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="520" y="235" font-size="13" fill="#444" font-weight="normal" text-anchor="start">① 세션 저장</text><line x1="845" y1="182" x2="780" y2="268" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="820" y="235" font-size="13" fill="#444" font-weight="normal" text-anchor="start">② 토큰으로 조회</text><text x="720" y="380" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">B도 같은 세션을 찾음 → 200</text><text x="720" y="494" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">✓ 어느 서버로 가도 로그인 유지</text></svg>