<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><title>장면 2 로그인이 풀림</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="600" height="470" fill="#FFFFFF"/><text x="300.0" y="32" font-size="19" fill="#222222" font-weight="bold" text-anchor="middle">② 로그인이 풀림</text><text x="300.0" y="56" font-size="14" fill="#555555" font-weight="normal" text-anchor="middle">A에서 로그인한 사용자의 다음 요청이 B로 감</text><rect x="10" y="70" width="580" height="390" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><rect x="40" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="160.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="160.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">로그인 처리</text><rect x="320" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="440.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="440.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">다음 요청을 받음</text><rect x="60" y="150" width="200" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="160.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="160.0" y="190" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">세션: 토큰 → 사용자</text><rect x="340" y="150" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D64545" stroke-width="2" stroke-dasharray="6 4"/><text x="440.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="440.0" y="190" font-size="14" fill="#D64545" font-weight="bold" text-anchor="middle">세션 없음</text><text x="160" y="280" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">① 로그인 → 세션 저장</text><text x="440" y="280" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">② 같은 토큰으로 요청</text><text x="440" y="340" font-size="16" fill="#D64545" font-weight="bold" text-anchor="middle">401 로그인 필요</text><text x="300.0" y="444" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ 사용자는 다음 클릭에서 로그아웃됨</text></svg>