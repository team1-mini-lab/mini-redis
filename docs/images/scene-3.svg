<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><title>장면 3 배포하면 DB가 몰림</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="960" height="520" fill="#FFFFFF"/><text x="480.0" y="34" font-size="20" fill="#222222" font-weight="bold" text-anchor="middle">③ 배포하면 DB가 몰림: 서버 A를 재시작한 직후</text><rect x="10" y="52" width="460" height="458" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><text x="240" y="80" font-size="16" fill="#555555" font-weight="bold" text-anchor="middle">로컬 캐시 (서버마다 따로)</text><rect x="490" y="52" width="460" height="458" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><text x="720" y="80" font-size="16" fill="#555555" font-weight="bold" text-anchor="middle">mini-redis (서버 밖 한 곳)</text><rect x="30" y="100" width="190" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="125.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="125.0" y="144" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">방금 재시작함</text><rect x="45" y="160" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#D64545" stroke-width="2" stroke-dasharray="6 4"/><text x="125.0" y="180" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">캐시 (dict)</text><text x="125.0" y="200" font-size="14" fill="#D64545" font-weight="bold" text-anchor="middle">비어 있음</text><rect x="270" y="100" width="190" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="365.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="365.0" y="144" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">재시작 차례를 기다림</text><rect x="285" y="160" width="160" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="365.0" y="180" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">캐시 (dict)</text><text x="365.0" y="200" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">인기 목록</text><rect x="40" y="390" width="180" height="52" rx="10" fill="#FDE8E8" stroke="#D64545" stroke-width="2"/><text x="130.0" y="411" font-size="14" fill="#222222" font-weight="bold" text-anchor="middle">DB</text><text x="130.0" y="430" font-size="13" fill="#D64545" font-weight="normal" text-anchor="middle">요청이 한꺼번에 몰림</text><line x1="95" y1="250" x2="95" y2="388" stroke="#D64545" stroke-width="2" marker-end="url(#ab)"/><line x1="125" y1="250" x2="125" y2="388" stroke="#D64545" stroke-width="2" marker-end="url(#ab)"/><line x1="155" y1="250" x2="155" y2="388" stroke="#D64545" stroke-width="2" marker-end="url(#ab)"/><text x="240" y="330" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">캐시가 프로그램 메모리에 있어</text><text x="240" y="348" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">재시작과 함께 사라짐</text><text x="240" y="494" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ 배포할 때마다 DB 조회가 몰림</text><rect x="510" y="100" width="190" height="80" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="605.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><rect x="750" y="100" width="190" height="80" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="845.0" y="124" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="605" y="150" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">방금 재시작함</text><text x="845" y="150" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">그대로</text><rect x="620" y="250" width="220" height="70" rx="10" fill="#DDF3EE" stroke="#2E9C84" stroke-width="2"/><text x="730.0" y="272" font-size="13" fill="#2E9C84" font-weight="bold" text-anchor="middle">mini-redis (서버 밖 한 곳)</text><text x="730.0" y="294" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">인기 목록 (그대로 남아 있음)</text><rect x="650" y="390" width="160" height="52" rx="10" fill="#EEEEEE" stroke="#777777" stroke-width="2"/><text x="730.0" y="411" font-size="14" fill="#222222" font-weight="bold" text-anchor="middle">DB</text><text x="730.0" y="430" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">한가함</text><line x1="605" y1="182" x2="680" y2="248" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="662" y="212" font-size="13" fill="#444" font-weight="normal" text-anchor="start">재시작 후에도 캐시에서 읽음</text><text x="720" y="494" font-size="15" fill="#2E8B57" font-weight="bold" text-anchor="middle">✓ 캐시가 서버 밖에 있어 재시작해도 그대로</text></svg>