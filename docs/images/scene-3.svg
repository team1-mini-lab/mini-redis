<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><title>장면 3 재시작하면 DB로 요청이 몰림</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="600" height="470" fill="#FFFFFF"/><text x="300.0" y="32" font-size="19" fill="#222222" font-weight="bold" text-anchor="middle">③ 재시작하면 DB로 요청이 몰림</text><text x="300.0" y="56" font-size="14" fill="#555555" font-weight="normal" text-anchor="middle">배포 등으로 서버 A를 재시작한 직후</text><rect x="10" y="70" width="580" height="390" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><rect x="40" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="160.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="160.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">방금 재시작함</text><rect x="320" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="440.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="440.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">아직 그대로</text><rect x="60" y="150" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D64545" stroke-width="2" stroke-dasharray="6 4"/><text x="160.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="160.0" y="190" font-size="14" fill="#D64545" font-weight="bold" text-anchor="middle">비어 있음</text><rect x="340" y="150" width="200" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="440.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="440.0" y="190" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">자주 읽는 데이터</text><rect x="60" y="350" width="200" height="52" rx="10" fill="#FDE8E8" stroke="#D64545" stroke-width="2"/><text x="160.0" y="371" font-size="14" fill="#222222" font-weight="bold" text-anchor="middle">DB</text><text x="160.0" y="390" font-size="13" fill="#D64545" font-weight="normal" text-anchor="middle">요청이 한꺼번에 몰림</text><line x1="120" y1="240" x2="120" y2="348" stroke="#D64545" stroke-width="2" marker-end="url(#ab)"/><line x1="160" y1="240" x2="160" y2="348" stroke="#D64545" stroke-width="2" marker-end="url(#ab)"/><line x1="200" y1="240" x2="200" y2="348" stroke="#D64545" stroke-width="2" marker-end="url(#ab)"/><text x="300" y="300" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">캐시가 프로그램 메모리에 있어</text><text x="300" y="318" font-size="12" fill="#555555" font-weight="normal" text-anchor="start">재시작과 함께 사라짐</text><text x="300.0" y="444" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ 재시작할 때마다 DB 조회가 몰림</text></svg>