<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><title>장면 1 데이터가 바뀌어도 다른 서버는 옛 값을 줌</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D64545"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker></defs><rect width="600" height="470" fill="#FFFFFF"/><text x="300.0" y="32" font-size="19" fill="#222222" font-weight="bold" text-anchor="middle">① 데이터가 바뀌어도 다른 서버는 옛 값을 줌</text><text x="300.0" y="56" font-size="14" fill="#555555" font-weight="normal" text-anchor="middle">서버 A에서 데이터 X를 수정한 직후</text><rect x="10" y="70" width="580" height="390" rx="12" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/><rect x="40" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="160.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 A</text><text x="160.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">수정 요청을 받음</text><rect x="320" y="90" width="240" height="150" rx="10" fill="#E8EEF7" stroke="#5B7DB1" stroke-width="2"/><text x="440.0" y="114" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">서버 B</text><text x="440.0" y="134" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">수정 사실을 모름</text><rect x="60" y="150" width="200" height="62" rx="8" fill="#FFF4D6" stroke="#C99A2E" stroke-width="2"/><text x="160.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="160.0" y="190" font-size="14" fill="#222222" font-weight="normal" text-anchor="middle">X = 새 값</text><rect x="340" y="150" width="200" height="62" rx="8" fill="#FFF4D6" stroke="#D64545" stroke-width="2"/><text x="440.0" y="170" font-size="12" fill="#555555" font-weight="normal" text-anchor="middle">서버 메모리 안의 캐시</text><text x="440.0" y="190" font-size="14" fill="#D64545" font-weight="bold" text-anchor="middle">X = 옛 값</text><rect x="200" y="350" width="200" height="52" rx="10" fill="#EEEEEE" stroke="#777777" stroke-width="2"/><text x="300.0" y="371" font-size="14" fill="#222222" font-weight="bold" text-anchor="middle">DB</text><text x="300.0" y="390" font-size="13" fill="#555555" font-weight="normal" text-anchor="middle">X = 새 값</text><line x1="160" y1="240" x2="260" y2="348" stroke="#444" stroke-width="2" marker-end="url(#a)"/><text x="130" y="310" font-size="13" fill="#444" font-weight="normal" text-anchor="start">① DB 수정</text><text x="150" y="262" font-size="12" fill="#555555" font-weight="normal" text-anchor="end">② 자기 캐시만 고침</text><text x="440" y="262" font-size="12" fill="#D64545" font-weight="normal" text-anchor="middle">B의 캐시는 그대로</text><text x="300.0" y="444" font-size="15" fill="#D64545" font-weight="bold" text-anchor="middle">✗ B로 간 요청은 옛 값을 받음</text></svg>